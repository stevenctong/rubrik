[defaults]
# These playbooks run entirely against localhost and talk to the Rubrik CDM
# REST API over HTTPS. No managed nodes, no SSH.
# Deliberately NOT defaulted to inventory/. Ansible merges every file in an
# inventory directory, so a bare run would silently combine all the wave
# files into one group and recover VMs you did not intend. Always name the
# wave explicitly:  -i inventory/<wave>.yml
roles_path     = roles
host_key_checking = False
# community.general.yaml was removed in that collection's v12; the
# built-in default callback with result_format=yaml supersedes it.
result_format  = yaml
# The trigger phase is a handful of API calls, so forks are irrelevant here --
# batching happens inside the API, not across Ansible forks.
forks          = 5
